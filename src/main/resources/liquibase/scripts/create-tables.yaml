databaseChangeLog:
  - changeSet:
      id: 1
      author: user
      changes:
        - createTable:
            tableName: faculty
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: color
                  type: VARCHAR(255)

  - changeSet:
      id: 2
      author: user
      changes:
        - createTable:
            tableName: student
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: age
                  type: INT
              - column:
                  name: faculty_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: student
            baseColumnNames: faculty_id
            referencedTableName: faculty
            referencedColumnNames: id
            constraintName: fk_student_faculty

  - changeSet:
      id: 3
      author: user
      changes:
        - createTable:
            tableName: avatar
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: file_path
                  type: VARCHAR(255)
              - column:
                  name: file_size
                  type: BIGINT
              - column:
                  name: media_type
                  type: VARCHAR(255)
              - column:
                  name: data
                  type: BYTEA
              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    unique: true
        - addForeignKeyConstraint:
            baseTableName: avatar
            baseColumnNames: student_id
            referencedTableName: student
            referencedColumnNames: id
            constraintName: fk_avatar_student
